services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rd
      POSTGRES_PASSWORD: rd
      POSTGRES_DB: rd
    ports:
      - "${POSTGRES_PORT:-22506}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rd"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-22509}:6379"
volumes:
  postgres-data:
